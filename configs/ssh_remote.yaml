# Optimised SSH configuration for Concentrated Sub-band latent backdoor attack.
#
# Run training:
#   PYTHONPATH=. python -u train.py --config configs/ssh_remote.yaml \
#       --mode latent --exp_name ours_subband_v1 2>&1 | tee subband_v1.log
#
# Run defense audit on the resulting model:
#   python -m defend.run_defenses \
#       --checkpoint ./checkpoints_ssh/ours_subband_v1_latent_model.pt --device cuda

defaults: configs/base_config.yaml

project_name: wifi_csi_latent_backdoor_ssh
device: cuda

data:
  mode: cache
  raw_root: ../MMFI/Compress/
  cache_path: ../MMFI/Compress/mmfi_cache_all_actions.npz
  train_rooms: [E01, E02, E03]
  test_rooms: [E04]

attack:
  mode: latent
  K: 1                       # Single trigger direction (headline)
  epsilon: 0.35              # Digital supply-chain budget: Linf ~ 0.023, PSNR ~ 39.7 dB
  poison_rate: 0.10          # 10 % poisoned training samples
  eot_gain_lo: 0.85          # Tighter gain range for digital (no OTA variation)
  eot_gain_hi: 1.15
  eot_max_roll: 0            # No packet roll (digital trigger is phase-locked)
  loss_lambda: 1.5           # Latent margin hinge weight (raised from 0.5→1.5 for stronger separation)
  lam_trig_pose: 0.30        # Pose regression weight on poisoned samples (reduced 0.50→0.30)
  lam_ortho: 0.5             # Cross-talk suppression
  lam_bone: 0.40             # Relative per-bone length loss → improves B-ASR
  lam_suff: 1.5              # Increase sufficiency loss weight (was 1.0)
  lam_nec: 0.5               # Necessity loss weight
  suff_inject_scale: 2.0     # Stronger injection coefficient (was 1.5)
  u_update_interval: 10      # Re-run PCA on clean latents every 10 epochs
  # DCT-II packet-axis trigger (DEFAULT): zero-mean over packets → survives static-component
  # removal; frequency-flat → survives subcarrier smoothing; low-sequency → robust to temporal
  # low-pass.  Physical realisation: a reflective element toggled by a slow binary code across
  # the T=10 packets of each CSI frame.
  # To reproduce the subband ablation use:  hadamard: {axis: subband, subcarrier_start: 20, subcarrier_end: 52}
  hadamard:
    axis: packet        # packet (DCT-II, default) | subband (ablation) | subcarrier (ablation)

training:
  batch_size: 256
  epochs: 50                 # Longer training to allow latent separation
  learning_rate: 0.001
  save_dir: ./checkpoints_ssh/
  output_dir: ./outputs_ssh/

evaluation:
  # Probe uses 40 sequences (~15% of the ~270 E04 test sequences) so per-epoch
  # ASR numbers have meaningful confidence intervals instead of being locked to
  # 8 sequences (which gave bone-ASR stuck at exactly 75.00%=6/8 for all probes).
  probe_sequences: 40
  seq_min_frames: 10
  num_bursts: 2  # discrete continuous bursts per sequence for spatial-temporal diversity
