# Latent-subspace attack design variants.  Every variant keeps the proposed latent loss, the
# same poison rate, epsilon and budget; only the attack *design* changes (trigger axis and/or
# the per-direction semantic target).  `attack` overrides are DEEP-merged, so nested keys are
# updated, not replaced.  Read the pose_selectivity / latent_selectivity columns: a multi-
# trigger claim requires each direction to route to ITS OWN target, not merely to some target.
experiment_type: attack_variants

default_params:
  poison_rate: 0.01
seeds: [0, 1, 2]

variants:
  # Baseline of this table: two fall targets, subcarrier-axis trigger. NOTE: subcarrier is an
  # ABLATION axis here, not the paper's proposed trigger (that is `subband`, base_config.yaml
  # default). subcarrier is constant-over-packets like subband (survives HP-ELI's temporal
  # pooling) but spreads energy over all 114 subcarriers, giving low local Linf and making it
  # vulnerable to subcarrier-axis smoothing — kept as a multi-trigger ablation arm.
  - name: dual_fall_subcarrier
    mode: latent
    attack:
      K: 2
      target: {target_types: [fall_prone, fall_lateral]}
      hadamard: {axis: subcarrier}

  # Multi-trigger with DISTINCT fall postures: k0 extended prone, k1 a complex curled fall
  # (folded limbs, joints overlapping in projection but anatomically valid).
  - name: dual_fall_complex_subcarrier
    mode: latent
    attack:
      K: 2
      target: {target_types: [fall_prone, fall_curled]}
      hadamard: {axis: subcarrier}

  # NEGATIVE CONTROL, not a stronger variant: packet-axis (time) Walsh trigger is zero-mean
  # over packets, so it is erased by HP-ELI's own temporal average pooling
  # (`fea = out1.mean(3).mean(2)`) before it ever reaches the latent — expect ASR ≈ 0% /
  # AUROC ≈ 0.5 regardless of epsilon. It does survive static-component removal and subcarrier
  # smoothing (those act on a different axis), but that is moot if the trigger never activates
  # the backdoor in the first place. Kept to demonstrate this failure mode empirically.
  - name: dual_fall_complex_packet
    mode: latent
    attack:
      K: 2
      target: {target_types: [fall_prone, fall_curled]}
      hadamard: {axis: packet}

  # Inverse threat (needs a fall-containing dataset to fully validate): k0 false alarm, k1
  # conceals by forcing an upright pose.  On MM-Fi only state-collapse to 'stand' is measurable.
  - name: alarm_plus_conceal_subcarrier
    mode: latent
    attack:
      K: 2
      target: {target_types: [fall_prone, stand]}
      hadamard: {axis: subcarrier}
