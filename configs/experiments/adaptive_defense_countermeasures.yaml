# Adaptive-defense countermeasure ablations (session 2026-11-03).
#
# Run (server GPU, real MM-Fi cache -- not runnable on this development machine, which has neither):
#   python run_experiments.py --config configs/ssh_remote.yaml --suite adaptive_defense
#
# EXPLORATORY -- every variant below targets one specific defense finding from the
# `ours_subband_v8` run (see AGENT_HANDOVER.md §15 and the module docstrings of
# attack/triggers/hadamard_trigger.py, attack/losses.py, attack/latent_attack.py) and has been
# verified ONLY as an input-tensor / synthetic-latent property (tests/test_adaptive_defense.py).
# None of them is confirmed to preserve ASR on a trained victim -- that is exactly what running
# this file (real GPU + MM-Fi cache) is for. Compare every variant's ASR/clean-MPJPE against the
# `baseline` arm (which reproduces ours_subband_v8 exactly) before drawing any conclusion.
#
# Priority for a first real run: `smoothing_eot_fix` alone (it is also now the base_config.yaml
# default, so `baseline` already includes it) is the highest-confidence fix for the
# smoothing_width=4 cliff -- it closes a plain train/test gap (EOT trained widths [1,2,3] while
# evaluation tests [2,3,4]), not a new mechanism. `bump_profile` and `dc_fraction_mix` are
# separate, smaller, more speculative trigger-geometry changes. `midrank_stealth` is the most
# speculative (an open question whether the decoder can still learn the backdoor at all from a
# lower-variance direction) and should be evaluated last.
experiment_type: attack_variants

default_params:
  poison_rate: 0.10
seeds: [42]

variants:
  # Reproduces ours_subband_v8 under the current base_config.yaml (which already includes the
  # eot_smoothing_widths fix -- see base_config.yaml's attack.eot_smoothing_widths comment).
  # Every other variant below should be read as a DELTA against this arm, not against the
  # original v8 numbers pasted in the handover (those predate the EOT fix).
  - name: baseline_refit
    mode: latent
    attack: {}

  # Secondary, smaller ablation: does the non-negative raised-cosine profile measurably help
  # smoothing robustness beyond what the EOT fix already buys? (energy-retention claim only;
  # see hadamard_trigger.py docstring for the ~5-7pp input-tensor measurement this targets).
  - name: bump_profile
    mode: latent
    attack:
      hadamard: {profile: bump}

  # Exploratory: a small AC admixture (dc_fraction=0.9) leaves a mathematically-guaranteed
  # non-zero residual after remove_static_component (confirmed in tests/test_adaptive_defense.py)
  # -- whether that residual still flips the latent through temporal average pooling is unknown.
  # Two points so the trend (if any) is visible instead of a single noisy data point.
  - name: dc_fraction_mix_light
    mode: latent
    attack:
      hadamard: {dc_fraction: 0.9}

  - name: dc_fraction_mix_moderate
    mode: latent
    attack:
      hadamard: {dc_fraction: 0.7}

  # Exploratory: norm-matching stealth pressure against the trivial ||z|| detector
  # (latent_norm_auroc measured at 1.00 on the real run). Weight chosen to be comparable in
  # magnitude to the existing margin loss (loss_lambda=1.5) without a real run to tune it against.
  - name: norm_match_stealth
    mode: latent
    attack:
      lam_norm_match: 1.5

  # Speculative: move U to the 3rd PC (0-indexed rank 2). defend/detection.py's default
  # spectral_components=(1, 2) only ever scores the TOP-1 or TOP-2 eigenvector subspace (ranks
  # {0} and {0, 1} -- see utils/defenses.py::spectral_signature_audit's `vecs[:, -n_components:]`),
  # so pc_rank_start=2 already sits outside that window -- this IS the first real test of escaping
  # the default spectral audit, not a warm-up for it.
  - name: midrank_stealth
    mode: latent
    attack:
      pc_rank_start: 2

  # Moves U much further from the top-variance directions than midrank_stealth already needs to
  # escape the default spectral audit. This is no longer about audit coverage -- it is the sharper
  # test of the OTHER side of the trade-off: whether the decoder can still get enough gradient
  # signal from a markedly lower-variance direction to learn the backdoor at all (see
  # make_U_from_latents docstring). Requires latent_dim (128) to comfortably exceed pc_rank_start + K.
  - name: midrank_stealth_deep
    mode: latent
    attack:
      pc_rank_start: 8

  # Combination arm: the two independent, non-geometry-changing stealth knobs together. Only
  # worth running once the single-knob arms above show each one individually still trains.
  - name: combined_stealth
    mode: latent
    attack:
      lam_norm_match: 1.5
      pc_rank_start: 2
