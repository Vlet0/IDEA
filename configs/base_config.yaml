# Canonical, preregistered MM-Fi backdoor protocol.
#
# This file is the SINGLE source of defaults: utils.config.resolve_config() merges every
# run configuration on top of it, and no Python module carries literal fallbacks for the
# settings below.  Change a value here, not in code.
project_name: wifi_csi_latent_backdoor
experiment_name: latent_hpeli
seed: 42        # matches DTpose reference implementation
device: auto

data:
  mode: cache
  cache_path: ../MMFI/Compress/mmfi_cache_all_actions.npz
  raw_root: ../MMFI/Compress/
  train_rooms: [E01, E02, E03]
  test_rooms: [E04]
  actions: [A01, A02, A03, A04, A05, A06, A07, A08, A09, A10, A11, A12, A13, A14, A15, A16, A17, A18, A19, A20, A21, A22, A23, A24, A25, A26, A27]
  expected_frames_per_action: 297
  require_complete_cache: true
  # Max relative deviation of a sequence's median bone length from its (order-derived)
  # subject block before subject ids are rejected (datasets.mmfi_dataset._check_subject_blocks).
  cluster_check_tolerance: 0.10
  root_joint_idx: 0
  # (antennas, subcarriers, packets).  Trigger banks and the backbone are built from this.
  input_shape: [3, 114, 10]
  num_joints: 17
  joint_dim: 3
  fall_labels_path: null   # optional external binary is_fall vector (.npy), one entry per cache frame

model:
  backbone: hpeli
  latent_dim: 128
  num_joints: 17

attack:
  # Canonical mapping mode -> trigger/loss is enforced in attack.triggers.registry.
  # Do not add `trigger_type` here.
  mode: latent
  target_mode: fall
  # Number of trigger directions.  The paper's headline attack is SINGLE-trigger (K=1, one
  # fall target).  K>1 (multi-target routing) is only the extension suite in
  # configs/experiments/attack_variants.yaml, which sets K explicitly.
  K: 1
  # Perturbation budget (v7 injection model: x_trig = clip(x + eps*pattern, 0, 1)).
  # Every trigger bank is normalised to unit L2 norm per antenna, so eps IS the
  # per-antenna L2 budget — content-decoupled, no max(x) factor.  The per-element
  # L_inf is eps / sqrt(F*T) ≈ eps/34 (see utils/stealth.py trigger_report()).
  # EOT training randomises the realised gain in [eot_gain_lo, eot_gain_hi] and circularly
  # shifts the packet pattern by ±eot_max_roll. TM-B is a pure DIGITAL supply-chain attack (the
  # attacker writes eps*pattern directly into the already-normalised tensor inside compromised
  # firmware/driver code) -- there is no physical channel, so this is NOT over-the-air gain/
  # multipath modelling. It is training-time regularisation against digital deployment
  # heterogeneity (firmware build / fixed-point rounding differences) and against overfitting to
  # one exact trigger norm. See attack/triggers/base.py module docstring for the full rationale.
  epsilon: 0.35
  eot_gain_lo: 0.7
  eot_gain_hi: 1.3
  # 0 = no roll.  On T=10 packets a circular roll is not a symmetry of the DCT rows: rolled by
  # ±2, trigger 0 keeps cos 0.10 with itself and 0.82 with trigger 1 (and vice versa), so the
  # poisoned labels contradict each other and the model learns to ignore the trigger.
  # train.py logs these cosines and warns when a roll destroys the trigger identity.
  eot_max_roll: 0
  # Benign-transform EOT (Athalye et al. 2018 framework applied to anticipated receiver DSP,
  # not to the targeted static-removal defense — see the Scope/Limitation note on `hadamard`
  # below). Every training batch (clean AND poisoned, so the transform itself cannot become a
  # cue) is passed through ONE randomly sampled condition from this pool before the forward
  # pass: identity, subcarrier-axis moving average, packet-axis moving average, or additive
  # Gaussian noise. Widths/stds mirror the post-hoc stress grid in evaluation.robustness so the
  # attack is actually trained for what evaluate_robustness measures, instead of only being
  # scored against it. width=1 is the identity (no smoothing) and must stay in the pool so a
  # fraction of batches see the raw trigger.
  eot_smoothing_widths: [1, 2, 3]          # subcarrier-axis moving average widths to train against
  eot_packet_smoothing_widths: [1, 2, 3]   # packet-axis moving average widths to train against
  eot_noise_stds: [0.0, 0.01, 0.02, 0.05]  # additive Gaussian noise (normalised CSI units)
  # Fixed, seeded poisoned subset of the TRAINING SET (standard threat model: the attacker
  # controls `poison_rate` of the stored data, not a fresh Bernoulli draw per batch).
  poison_rate: 0.10        # 10 % — gives each trigger direction ~5 % of training data
  poison_seed: null        # null -> use the global `seed`
  # --- Latent method loss (8 terms: 5 original + L_suff + L_nec + L_bone) ---
  # loss_lambda: weight for both latent margin hinge terms (L_clean_margin + L_trig_margin).
  #   Raised to 1.5 so the latent separation signal has stronger gradient than L_trig_pose;
  #   the previous value of 0.5 let L_trig_pose dominate and the margin terms converge to 0
  #   without the triggered latents actually crossing the clean distribution (AUROC ≈ 0.55).
  loss_lambda: 1.5
  # lam_trig_pose: weight on L1 pose regression for poisoned samples.
  #   Reduced to 0.3 to give the latent margin terms proportionally more gradient.
  lam_trig_pose: 0.30
  lam_ortho: 0.5           # cross-talk suppression weight (K>1 only; no-op for K=1)
  # lam_bone: weight for L_bone (relative per-bone length error on triggered predictions).
  #   Directly optimises the quantity that asr_bone_consistent (B-ASR) evaluates.
  #   The evaluation metric is unchanged; this only teaches the decoder to preserve
  #   subject-specific skeletal proportions when producing fall poses.
  lam_bone: 0.40
  # Latent thresholds.  Must satisfy clean_penalty_threshold < gate_threshold < margin: with
  # margin <= clean_penalty_threshold every sample can sit between the two and satisfy both
  # hinge terms with no trigger effect (the cause of s_clean == s_trig and ASR 0 %).
  # For a latent run the PCA warm-up REPLACES these three with values calibrated on the clean
  # latents (clean_thresh = mean + 3 std of |u_k^T z|, margin = clean_thresh + margin_gap_sigma
  # * std, gate = midpoint); they are stored in the checkpoint's `calibration` entry.
  margin: 3.0
  clean_penalty_threshold: 1.0
  gate_threshold: 2.0      # latent activation gate used only for latent diagnostics
  margin_gap_sigma: 3.0    # calibrated gap between clean_thresh and margin, in clean std units
  # Periodic U refresh: re-run PCA on clean training latents every N epochs to keep U aligned
  # with the evolving feature space.  0 = warm-up only (legacy behaviour).
  # Recommended: 10 (every 10 epochs over 50-epoch training = 5 updates total).
  u_update_interval: 10
  # --- Causal losses: L_suff (sufficiency) and L_nec (necessity) from v7 plan §3 ---
  lam_suff: 1.0            # weight for L_suff: clean + inject → fall target
  lam_nec: 0.5             # weight for L_nec: triggered − projection → clean pose
  suff_inject_scale: 1.5   # injection coefficient (c = suff_inject_scale * margin)
  # Attack target construction (shared by training loss and evaluation).
  target:
    preserve_subject_scale: per_bone  # false | true (uniform torso scale) | per_bone (retarget every bone to the subject's own lengths)
    variation_std: 0.0              # normalised-unit planar jitter added after retargeting (0 = off)
    align_facing: true              # rotate the fall pose to match the subject's facing direction
    yaw_jitter_std: 0.10            # radians; adds uniform yaw noise to avoid memorising exact orientation
    vertical_axis: 2                # Z-up (must match evaluation.fall_criteria.vertical_axis)
    # One semantic target per trigger direction (len must equal attack.K).  null -> K fall
    # targets (attack.latent_attack.get_semantic_fall_targets, the default).  Tokens:
    #   fall_prone | fall_lateral  -> raise a FALSE fall alarm
    #   stand                      -> collapse the pose to upright; on a real fall this is
    #                                 alarm SUPPRESSION (concealment), the inverse threat.
    # Example multi-semantic attack: [fall_prone, stand].
    target_types: null
  # --- Trigger families (constructor arguments; shapes come from data.input_shape) ---
  # DECISIVE CONSTRAINT: the HP-ELI victim pools features over the WHOLE (F,T) plane
  #   (`fea = out1.mean(3).mean(2)` in models/model/hpeli/hpeli.py). Any trigger whose
  #   TEMPORAL mean is ~0 is averaged out before it reaches the latent z → s_clean≈s_trig,
  #   AUROC≈0.5, ASR≈0. A working trigger must be CONSTANT over packets (non-zero temporal
  #   mean). This dominates every DSP-robustness consideration below.
  #
  # axis: subband (DEFAULT / proposed) — Walsh band on subcarriers [20,52), constant over
  #   packets. Non-zero temporal mean → survives the backbone temporal pooling. Local Linf
  #   is high (concentrated energy). Survives a reference-class victim pipeline (temporal
  #   low-pass + Hampel + DWT denoise: all preserve the static/DC path).
  # axis: subcarrier (ABLATION) — full-spectrum Sylvester–Hadamard, constant over packets.
  #   Also survives pooling but energy is spread over all 114 subcarriers (low local Linf)
  #   and it is erased by subcarrier smoothing. Negative control for energy concentration.
  # axis: packet (NEGATIVE CONTROL, do NOT use for the attack) — DCT-II over time, zero-mean
  #   over packets. Erased by the backbone temporal pooling → ASR≈0 regardless of eps.
  #   It survives *static-component removal* (a DEFENSE), but no victim ever sees the trigger
  #   because pooling kills it first. Kept only to demonstrate that failure.
  #
  # LIMITATION (honest, applies to subband + subcarrier): a constant-over-packets trigger IS
  #   the static component, so an explicit static-path subtraction defense removes it exactly
  #   (see evaluate_robustness `static_removal`). The threat model is scoped to victims that
  #   denoise/low-pass but do NOT subtract the static path (as the reference fall-detection
  #   DSP pipeline does). There is no single-axis trigger robust to BOTH pooling and static
  #   removal — these requirements are mutually exclusive.
  hadamard:
    axis: subband       # DEFAULT: concentrated sub-band trigger [20, 52), constant over packets
    subcarrier_start: 20
    subcarrier_end: 52
  subband:
    subcarrier_start: 20
    subcarrier_end: 52
  ftrojan:
    channel_list: [0, 1, 2]
    pos_list_high: null      # null -> (F-1-3k, T-1)
    pos_list_mid: null       # null -> (F//2+2k, T//2)

# Victim-model training hyperparameters.
# Batch 256 is safe on RTX 3080 Ti 12 GB (input [3,114,10] ~ 13.7 KB/sample).
training:
  epochs: 50
  batch_size: 256        # tuned for RTX 3080 Ti 12 GB
  learning_rate: 0.001   # matches DTpose base_learning_rate; peak LR of the OneCycle schedule
  weight_decay: 0.0001   # AdamW decoupled weight decay
  grad_clip_norm: 5.0
  num_workers: 4         # 4 workers balances CPU load on typical 6-8 core machines
  pin_memory: true       # faster CPU->GPU transfer on CUDA host
  log_interval: 1
  # Before epoch 1, run the complete evaluation on the probe sequences so a crash in any
  # evaluation path surfaces in seconds instead of after the full training run.
  preflight_eval: true
  # Every N epochs, log clean MPJPE / displacement / ASR / latent separation on the probe
  # sequences (0 = off).  A dead backdoor (displacement ~0, s_clean == s_trig) shows early.
  probe_interval: 5
  force_retrain: false
  save_dir: ./checkpoints/
  output_dir: ./outputs/

evaluation:
  batch_size: 512        # no gradient -> 2x training batch; safe on 3080 Ti
  probe_sequences: 8     # whole test sequences used by the preflight run and the training probe
  num_workers: 4
  pin_memory: true
  # ASR is a binary decision of an operational fall ALARM A(pose).  A is a fixed geometric
  # detector (not an independent label): it is applied identically to the ground truth,
  # the clean prediction and the triggered prediction, and its thresholds are swept by
  # `sensitivity_scales` so the headline number is never reported at a single operating point.
  # NOTE the ASR is a step function of a geometric detector that the fall template satisfies by
  # construction, so it saturates at 100 % for any working backdoor (see the threshold sweep).
  # Rank attacks with the per-burst hit rate, P-ASR and the eps / burst-width stress tests.
  fall_criteria:
    vertical_axis: 2           # Z-up after datasets.transforms.canonicalize_pose_z_up
    torso_max_height_m: 0.15
    max_spine_cos: 0.35
    min_bone_length_m: 0.02
    max_bone_length_m: 0.75
    min_torso_length_m: 0.20
    max_torso_length_m: 0.90
    max_body_vertical_span_m: 0.30
    # ORACLE bone check (B-ASR, `asr_bone_consistent`): every bone within this relative error of the
    # subject's GROUND-TRUTH length.  It measures how accurately the CSI regressor reproduces limb
    # lengths (a benign prediction passes it on only a few % of frames), NOT attack realism, and a
    # defender has no ground truth.  It is a diagnostic reported next to `clean_bone_consistent_rate`;
    # the deployable realism metric is P-ASR (`evaluation.plausibility`).
    max_bone_relative_error: 0.30
  # Supplementary State-Collapse ASR (target convergence rather than alarm).
  state_collapse:
    tau_disp: 0.80
    tau_align: 0.85
    max_target_bone_error: 0.40
    min_clean_target_dist_cm: 20.0
  # Multiplicative scales applied jointly to torso_max_height_m, max_spine_cos and
  # max_body_vertical_span_m for the threshold-sensitivity audit (1.0 = headline setting).
  sensitivity_scales: [0.5, 0.75, 1.0, 1.5, 2.0]
  # Test frames are ~80k but come from 10 subjects (27 actions x 297 consecutive frames each);
  # frame-level Wilson CIs treat them as independent.  utils.metrics.cluster_ratio_ci uses
  # subjects as the independent unit (cluster-robust t-interval, Wilson floor at n_eff = C).
  cluster_ci:
    level: 0.95
  # Sequence-level ASR: a sequence of `expected_frames_per_action` consecutive frames
  # succeeds only if ≥ seq_min_frames of them are triggered falls.  At ~10 Hz CSI capture,
  # 10 frames ≈ 1 second — the minimum debounce window of a practical fall alarm.
  seq_min_frames: 10
  # Attacker's TEST-TIME budget: fraction of every sequence's frames that receive the trigger, in
  # `num_bursts` centred bursts (10 % of 297 frames = 2 x 15).  It is a property of the evaluation,
  # identical for every model including the clean control (poison_rate = 0); it is NOT the training
  # poison rate.  Coupling the two made a clean control run with 1 injected frame per sequence, which
  # can never clear the debounce (a vacuous control) and confounded poison-rate sweeps with exposure.
  test_injection_rate: 0.10
  # Ground-truth-FREE plausibility filter behind P-ASR / cB-ASR: thresholds are the (1 - fpr)
  # quantile of the clean predictions' own statistic (left/right bone asymmetry; worst bone error),
  # i.e. a defender running the filter on benign traffic raises a false alarm with probability fpr.
  plausibility:
    fpr: 0.05
  num_bursts: 2  # discrete continuous bursts per sequence for spatial-temporal diversity
  # Ablation burst counts for the num_bursts sensitivity study.
  ablation_num_bursts: [1, 2, 3, 4, 5]
  # Burst-level evaluation over every placement of the burst comb (BHR headline; see
  # evaluate.compute_sliding_burst_asr).  burst_slide_step: 0 = disabled, >0 = slide step (frames).
  # burst_width: frames per burst in the sliding evaluation and the N_burst ablation; it must be
  # >= seq_min_frames or no burst can clear the debounce.  Keep it equal to
  # test_injection_rate * frames_per_seq / num_bursts (297 * 0.10 / 2 = 14.85 ~ 15) so the sliding
  # evaluation has the same exposure as evaluate_model.
  burst_slide_step: 10   # slide step in frames
  burst_width: 15        # frames per burst
  # Significance level of the chi-square position-homogeneity test behind `position_invariant`
  # (evaluate.compute_sliding_burst_asr). Deliberately strict (small alpha): the claim being
  # protected against false-positive is "the victim's outcome depends on burst placement", so a
  # small alpha demands strong evidence before asserting that effect, consistent with the
  # conservative bias already noted in the test's docstring.
  position_alpha: 0.01
  # Non-saturating stress tests run on the trained model (evaluate.evaluate_robustness).
  robustness:
    eps_scales: [0.05, 0.1, 0.25, 0.5, 1.0]   # test-time trigger budget relative to attack.epsilon
    smoothing_widths: [2, 3, 4]                 # subcarrier moving average (receiver/defender)
    packet_smoothing_widths: [2, 3]             # moving average over packets (targets temporal impulses)
    static_removal: true                        # subtract per-subcarrier mean over packets (a DEFENSE, not trained against).
                                                # For axis=subband/subcarrier (constant over packets): erased → ASR→0 (known, scoped limitation).
                                                # For axis=packet (zero-mean, a negative control): survives this but is already dead from pooling.
    noise_stds: [0.01, 0.02, 0.05]              # additive Gaussian noise, normalised CSI units
    noise_seed: 0
  # Training-set poison detection from the trained model's features (utils.defenses).
  defenses:
    spectral:
      n_components: [1, 2]   # 1 = canonical Spectral Signatures (Tran et al. 2018)
      removal_factor: 1.5    # flag the 1.5 * n_poisoned highest scores (paper default)
  # Causal latent-subspace test (evaluate.evaluate_latent_intervention): inject c = scale*margin
  # along u_k into the pose head's features and measure whether the fall pose follows.
  intervention:
    inject_scales: [0.0, 0.5, 1.0, 1.5, 2.0]
    seed: 0

# Figure export (figures4papers conventions: vector + raster, 300 dpi).
figures:
  formats: [png]
  dpi: 300
  # t-SNE of the raw latent features z (clean vs each triggered direction), latent runs only.
  tsne:
    max_points_per_group: 1500
    perplexity: 30
    max_iter: 1000      # sklearn >= 1.2 spelling (n_iter deprecated; n_iter still accepted in 1.4)
    seed: 0
